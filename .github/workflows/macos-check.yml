name: macOS compile checks (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          rustup show
      - name: Check native Keychain and shared client code
        run: |
          export TMPDIR="$(cd -- "$TMPDIR" && pwd -P)"
          cargo check --locked -p vaults-cli
          cargo test --locked -p vaults-cli --lib
          pnpm --filter @127vaults/desktop check
          pnpm --filter @127vaults/desktop test
          pnpm --filter @127vaults/extension test
      - name: Compile native desktop without distributing an installer
        run: pnpm --filter @127vaults/desktop exec tauri build --no-bundle -- --locked
