name: Publish coordinated release
run-name: Publish 127Vaults ${{ inputs.version }} from main
on:
  workflow_dispatch:
    inputs:
      version:
        description: Coordinated X.Y.Z version with committed Markdown and public release notes
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: workstation-release
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'schemburkar/127Vaults' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'schemburkar' &&
      github.triggering_actor == 'schemburkar'
    runs-on: [self-hosted, Windows, X64, vaults-release]
    timeout-minutes: 720
    permissions:
      contents: write
    steps:
      - name: Build, publish, verify, and release
        shell: pwsh
        working-directory: C:\Projects\127Vaults
        env:
          RELEASE_SOURCE: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_RUN: ${{ github.run_id }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          & C:\Projects\127Vaults\scripts\release\publish-workflow.ps1 -Revision $env:RELEASE_SOURCE -Version $env:RELEASE_VERSION -Label "actions-release-$env:RELEASE_RUN" -Attempt ([int]$env:RELEASE_ATTEMPT)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
