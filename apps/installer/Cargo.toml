[package]
name = "vaults-installer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "127vaults-install"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.1", features = ["derive", "env"] }
cliclack = "=0.5.6"
reqwest = { version = "=0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.11.0"
hex = "=0.4.3"
url = "=2.5.8"
dirs = "=6.0.0"
atomic-write-file = "=0.3.1"
uuid = { version = "=1.18.1", features = ["v4"] }
flate2 = "=1.1.10"
tar = "=0.4.46"
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }

[lints]
workspace = true
