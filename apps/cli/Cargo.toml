[package]
name = "vaults-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "127vaults"
path = "src/main.rs"

[[bin]]
name = "127vaults-extension-host"
path = "src/extension_host_main.rs"

[[bin]]
name = "127vaults-native-passkey-host"
path = "src/native_passkey_host_main.rs"

[dependencies]
clap = { version = "=4.6.1", features = ["derive"] }
sha2 = { version = "=0.11.0", default-features = false }
url = "=2.5.8"
reqwest = { version = "=0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "=0.22.1"
atomic-write-file = "=0.3.1"
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
hex = "=0.4.3"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
rpassword = "=7.5.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
dirs = "=6.0.0"
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
zeroize = "=1.8.2"
p256 = { version = "=0.13.2", features = ["ecdsa", "pkcs8"] }
ciborium = "=0.2.2"
vaults-crypto = { path = "../../crates/crypto" }
vaults-protocol = { path = "../../crates/protocol" }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }

[lints]
workspace = true
