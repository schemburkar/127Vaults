[package]
name = "vaults-desktop-poc"
version = "0.0.0"
description = "127Vaults drag-to-fill feasibility POC"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = [] }
serde_json = "=1.0.145"
url = "=2.5.8"
dirs = "=6.0.0"
tauri-plugin-opener = "2.5.3"
vaults-cli = { path = "../../cli" }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
