[workspace]
resolver = "2"
members = [
  "apps/installer",
  "apps/cli",
  "apps/desktop/src-tauri",
  "crates/crypto",
  "crates/browser-fixture",
  "crates/protocol",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "LicenseRef-127Vaults-Source-Available"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[patch.crates-io]
# GTK3 still requires glib 0.18. Backport the upstream RUSTSEC-2024-0429 fix.
glib = { path = ".cargo/vendor/glib-0.18.5" }

# Desktop dev uses native crypto, whereas the browser fixture is built with
# --release. Keep application debugging while avoiding unoptimized password
# derivation and curve arithmetic. The frozen KDF parameters are unchanged.
[profile.dev.package.vaults-crypto]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.opaque-ke]
opt-level = 3
