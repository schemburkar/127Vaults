[workspace]
resolver = "2"
members = [
  "apps/cli",
  "apps/desktop/src-tauri",
  "crates/crypto",
  "crates/browser-fixture",
  "crates/protocol",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "BUSL-1.1"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
